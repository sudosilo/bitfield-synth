<!DOCTYPE html>
<!-- // BLUE CODE — Blue Phone : bitfield video synth -->
<!-- Recreates the Hydra/Bitfolly visual natively. No CDN, no emptyfla.sh, no Hydra. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light only">
<title>Bitfield Synth</title>
<style>
  :root{
    --bg:#EEF2F7; --panel:#FFFFFF; --ink:#0F1B2D; --muted:#5C6B80;
    --line:#D6DEE8; --blue:#1F6FEB; --blue-d:#1556C0; --field:#0A0E14;
    color-scheme: light only;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg)!important; color:var(--ink)!important;
    -webkit-text-fill-color:var(--ink); color-scheme:light only;}
  body{font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    padding:10px; max-width:560px; margin:0 auto; overflow-x:hidden;}
  .stage{position:relative; border:1px solid var(--line); border-radius:14px;
    overflow:hidden; background:var(--field); box-shadow:0 1px 0 #fff inset, 0 6px 18px rgba(15,27,45,.08);}
  canvas{display:block; width:100%; height:auto; touch-action:none;}
  .tag{position:absolute; left:10px; bottom:8px; font:11px/1 ui-monospace,Menlo,monospace;
    color:#8fb6ff; -webkit-text-fill-color:#8fb6ff; letter-spacing:.5px; opacity:.85;
    pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .panel{background:var(--panel)!important; border:1px solid var(--line);
    border-radius:14px; padding:12px; margin-top:10px;}
  label.lbl{display:block; font-size:11px; font-weight:600; color:var(--muted);
    -webkit-text-fill-color:var(--muted); text-transform:uppercase; letter-spacing:.7px; margin:0 0 5px;}
  .expr{display:flex; gap:8px; align-items:stretch;}
  textarea#expr{flex:1; min-height:46px; resize:vertical; padding:9px 10px;
    font:14px/1.35 ui-monospace,Menlo,Consolas,monospace; color:var(--ink)!important;
    -webkit-text-fill-color:var(--ink); background:#F7FAFD!important; border:1px solid var(--line);
    border-radius:10px; color-scheme:light only;}
  textarea#expr:focus{outline:none; border-color:var(--blue); background:#fff!important;}
  .row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  button{appearance:none; border:1px solid var(--line); background:#fff!important;
    color:var(--ink)!important; -webkit-text-fill-color:var(--ink); font-weight:600; font-size:13px;
    padding:9px 13px; border-radius:10px; cursor:pointer; color-scheme:light only;}
  button:active{transform:translateY(1px);}
  button.primary{background:var(--blue)!important; color:#fff!important;
    -webkit-text-fill-color:#fff; border-color:var(--blue-d);}
  button.on{background:var(--blue)!important; color:#fff!important; -webkit-text-fill-color:#fff; border-color:var(--blue-d);}
  .ctl{flex:1 1 150px;}
  .ctl .val{float:right; font:12px ui-monospace,monospace; color:var(--blue); -webkit-text-fill-color:var(--blue);}
  input[type=range]{width:100%; accent-color:var(--blue);}
  .presets{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{font-size:12px; padding:7px 10px; border:1px solid var(--line); border-radius:999px;
    background:#fff!important; color:var(--ink)!important; -webkit-text-fill-color:var(--ink); cursor:pointer;}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .seg button{border:0; border-radius:0; border-right:1px solid var(--line); padding:8px 11px;}
  .seg button:last-child{border-right:0;}
  .hint{font-size:11px; color:var(--muted); -webkit-text-fill-color:var(--muted); margin-top:8px;}
  .err{color:#C0392B; -webkit-text-fill-color:#C0392B; font:12px ui-monospace,monospace; margin-top:6px; min-height:14px;}
</style>
</head>
<body>

<div class="stage">
  <canvas id="cv"></canvas>
  <div class="tag">// BLUE CODE · Blue Phone</div>
</div>

<div class="panel">
  <label class="lbl" for="expr">Expression &nbsp;<span style="font-weight:400;text-transform:none;letter-spacing:0">vars: x y t a[] · Math.* allowed</span></label>
  <div class="expr">
    <textarea id="expr" spellcheck="false">Math.tan(x|y^t/30)*10</textarea>
  </div>
  <div class="err" id="err"></div>
  <div class="presets" style="margin-top:8px">
    <span class="chip" data-e="Math.tan(x|y^t/30)*10">original</span>
    <span class="chip" data-e="(x^y)+t">xor</span>
    <span class="chip" data-e="Math.tan(x*y/40 + t/20)*8">moiré</span>
    <span class="chip" data-e="Math.sin(x/8+t/30)+Math.sin(y/8)+Math.sin((x+y)/16+t/40)">plasma</span>
    <span class="chip" data-e="(x|y^t/20)*(1+(a[(x+y)&31]||0)*5)">audio bloom</span>
  </div>
</div>

<div class="panel">
  <div class="row">
    <button class="primary" id="play">Pause</button>
    <div class="seg" id="color">
      <button data-c="mono" class="on">Mono</button>
      <button data-c="blue">Blue</button>
      <button data-c="spectrum">Spectrum</button>
    </div>
    <button id="audio">Audio off</button>
  </div>
  <div class="row">
    <div class="ctl"><label class="lbl">Feedback <span class="val" id="fbV">0.995</span></label>
      <input type="range" id="fb" min="950" max="1000" value="995"></div>
    <div class="ctl"><label class="lbl">Speed <span class="val" id="spV">1.0</span></label>
      <input type="range" id="sp" min="1" max="40" value="10"></div>
    <div class="ctl"><label class="lbl">Resolution <span class="val" id="resV">128</span></label>
      <input type="range" id="res" min="48" max="256" step="16" value="128"></div>
  </div>
  <div class="hint">Field is evaluated per-pixel, then difference-blended against the previous frame scaled by the feedback amount — the same two layers as the Hydra source. Audio fills <code>a[ ]</code> with live mic frequency bins (0–1).</div>
</div>

<script>
// ---- Blue Phone : bitfield video synth engine ----------------------------
const cv  = document.getElementById('cv');
const dctx= cv.getContext('2d', {alpha:false});
let DPR = Math.min(devicePixelRatio||1, 2);

// field (low-res signal) + ping-pong feedback buffers
const field = document.createElement('canvas');
const fctx  = field.getContext('2d', {alpha:false});
let fbA = document.createElement('canvas'), fbB = document.createElement('canvas');
let aCtx = fbA.getContext('2d',{alpha:false}), bCtx = fbB.getContext('2d',{alpha:false});

let RES=128, SPEED=1.0, FB=0.995, COLOR='mono', t=0, playing=true;
let fn=null, fdata=null, audio=null, aArr=new Float32Array(64);

function sizeDisplay(){
  const w = cv.clientWidth || 320;
  const h = Math.round(w*0.75);            // 4:3 stage
  cv.width  = Math.round(w*DPR);
  cv.height = Math.round(h*DPR);
  for(const c of [fbA,fbB]){ c.width=cv.width; c.height=cv.height; }
  dctx.imageSmoothingEnabled=false;
  aCtx.imageSmoothingEnabled=true; bCtx.imageSmoothingEnabled=true;
}
function sizeField(){
  field.width=RES; field.height=RES;
  fdata = fctx.createImageData(RES,RES);
}

function compile(src){
  try{
    // x,y in field coords; t time; a[] audio bins; Math available
    const f = new Function('x','y','t','a','Math',
      'var v=('+src+'); return v;');
    f(0,0,0,aArr,Math);                       // smoke test
    fn=f; setErr(''); return true;
  }catch(e){ setErr(e.message); return false; }
}
function setErr(m){ document.getElementById('err').textContent = m; }

function renderField(){
  const d=fdata.data, R=RES;
  for(let y=0;y<R;y++){
    for(let x=0;x<R;x++){
      let v; try{ v=fn(x,y,t,aArr,Math); }catch(_){ v=0; }
      if(!isFinite(v)) v=0;
      let b=( (v|0) & 255 );                  // bytebeat-style wrap
      let r,g,bl;
      if(COLOR==='mono'){ r=g=bl=b; }
      else if(COLOR==='blue'){ r=(b*0.22)|0; g=(b*0.52)|0; bl=Math.min(255,(b*1.1)|0); }
      else { // spectrum: b -> hue
        const h=b/255*360, c=255, X=(c*(1-Math.abs((h/60)%2-1)))|0;
        if(h<60){r=c;g=X;bl=0;}else if(h<120){r=X;g=c;bl=0;}
        else if(h<180){r=0;g=c;bl=X;}else if(h<240){r=0;g=X;bl=c;}
        else if(h<300){r=X;g=0;bl=c;}else{r=c;g=0;bl=X;}
      }
      const i=(y*R+x)*4; d[i]=r; d[i+1]=g; d[i+2]=bl; d[i+3]=255;
    }
  }
  fctx.putImageData(fdata,0,0);
}

function frame(){
  if(playing){
    if(audio){ audio.analyser.getByteFrequencyData(audio.buf);
      for(let i=0;i<aArr.length;i++) aArr[i]=audio.buf[i]/255; }
    renderField();
    // new = | field  -  prev*FB |   (Hydra diff + scale feedback)
    aCtx.globalCompositeOperation='copy';
    aCtx.drawImage(field,0,0,cv.width,cv.height);          // upscaled field
    aCtx.globalCompositeOperation='difference';
    const w=cv.width,h=cv.height, sw=w*FB, sh=h*FB;
    aCtx.drawImage(fbB,(w-sw)/2,(h-sh)/2,sw,sh);           // prev, scaled & centered
    dctx.drawImage(fbA,0,0);                               // show
    [fbA,fbB]=[fbB,fbA]; [aCtx,bCtx]=[bCtx,aCtx];          // ping-pong
    t += SPEED;
  }
  requestAnimationFrame(frame);
}

// ---- audio ---------------------------------------------------------------
async function toggleAudio(btn){
  if(audio){ audio.stream.getTracks().forEach(t=>t.stop());
    audio=null; btn.textContent='Audio off'; btn.classList.remove('on'); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const an=ac.createAnalyser(); an.fftSize=128;
    ac.createMediaStreamSource(stream).connect(an);
    audio={stream,analyser:an,buf:new Uint8Array(an.frequencyBinCount)};
    aArr=new Float32Array(an.frequencyBinCount);
    btn.textContent='Audio on'; btn.classList.add('on');
  }catch(e){ setErr('mic blocked: '+e.message); }
}

// ---- wiring --------------------------------------------------------------
const ex=document.getElementById('expr');
ex.addEventListener('input',()=>compile(ex.value));
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  ex.value=c.dataset.e; compile(ex.value);});
document.getElementById('play').onclick=function(){
  playing=!playing; this.textContent=playing?'Pause':'Play';};
document.querySelectorAll('#color button').forEach(b=>b.onclick=()=>{
  COLOR=b.dataset.c;
  document.querySelectorAll('#color button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');});
document.getElementById('audio').onclick=function(){toggleAudio(this);};
const fb=document.getElementById('fb'),fbV=document.getElementById('fbV');
fb.oninput=()=>{FB=fb.value/1000; fbV.textContent=FB.toFixed(3);};
const sp=document.getElementById('sp'),spV=document.getElementById('spV');
sp.oninput=()=>{SPEED=sp.value/10; spV.textContent=SPEED.toFixed(1);};
const rs=document.getElementById('res'),resV=document.getElementById('resV');
rs.oninput=()=>{RES=+rs.value; resV.textContent=RES; sizeField();};

addEventListener('resize',()=>{DPR=Math.min(devicePixelRatio||1,2); sizeDisplay();});
sizeDisplay(); sizeField(); compile(ex.value); frame();
</script>
</body>
</html>
